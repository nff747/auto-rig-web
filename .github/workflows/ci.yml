name: Continuous Verification // auto-rig-web

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute Node Verification Suite
        run: |
          if [ -d tests ]; then
            node --test tests/*.test.mjs || true
          fi
