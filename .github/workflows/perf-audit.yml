name: Performance & Latency Audit // auto-rig-web

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Latency Microbenchmarks
        run: |
          if [ -d benchmarks ]; then
            node benchmarks/latency.bench.mjs || true
          fi
